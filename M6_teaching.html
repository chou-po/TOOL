<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羅格鎮出勤任務</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 投影用單頁遊戲。頂部航線式八節點進度＋分數，中央關卡卡片（題目在左、圖／地圖在右），底部講師工具列。單一明亮海圖風格。 */
:root{
  --sea:#d9efee;        /* 海圖底色 */
  --sea-line:#b9dcda;
  --ink:#16324a;        /* 深海藍文字 */
  --ink-soft:#4a6377;
  --paper:#fffdf7;      /* 卡片 */
  --engine:#e2412e;     /* 消防車紅（主色） */
  --engine-dk:#b52a1b;
  --sun:#ffc63a;        /* 高光黃 */
  --good:#1f9d6b;
  --warn:#f08a24;
  --line:#d6dfe3;
  --r1:#e0661f; --r2:#2e63b8; --r3:#22885a; --r4:#7a4bb3;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Bungee","Huninn",system-ui,sans-serif;
  color-scheme:light;
  font-size:clamp(15px, 0.6vw + 9px, 21px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--sea);color:var(--ink);font-family:var(--f-body);line-height:1.6;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    linear-gradient(var(--sea-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--sea-line) 1px, transparent 1px);
  background-size: 46px 46px, 92px 92px, 92px 92px;
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- header ---------- */
.top{
  background:var(--ink);color:#fff;
  padding-block:.55rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;
  box-shadow:0 4px 0 #0e2233;
}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.75;letter-spacing:.08em;white-space:nowrap}
.route{display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.buoy{display:flex;flex-direction:column;align-items:center;gap:.15rem;flex:1 1 0;min-width:0;position:relative}
.buoy::before{content:"";position:absolute;top:.95rem;left:-50%;width:100%;border-top:3px dashed rgba(255,255,255,.28);z-index:0}
.buoy:first-child::before{display:none}
.buoy i{
  position:relative;z-index:1;width:1.9rem;height:1.9rem;border-radius:50%;
  display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:.8rem;
  background:#2a4a66;color:#9fb6c8;border:3px solid #2a4a66;transition:.25s;
}
.buoy span{font-size:.68rem;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.buoy.done i{background:var(--good);border-color:var(--good);color:#fff}
.buoy.done::before,.buoy.now::before{border-top-color:var(--sun)}
.buoy.now i{background:var(--sun);border-color:#fff;color:var(--ink);transform:scale(1.18)}
.buoy.now span{opacity:1;color:var(--sun);font-weight:700}
.stats{display:flex;align-items:center;gap:1rem}
.score{text-align:right}
.score small{display:block;font-size:.66rem;opacity:.7;letter-spacing:.1em}
.score b{font-family:var(--f-num);font-weight:400;font-size:1.5rem;color:var(--sun);font-variant-numeric:tabular-nums}
.risk{width:7.5rem}
.risk small{display:flex;justify-content:space-between;font-size:.66rem;opacity:.8;letter-spacing:.06em}
.riskbar{height:.6rem;border-radius:99px;background:#2a4a66;overflow:hidden;margin-top:.2rem}
.riskbar div{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--sun) 55%,var(--engine));background-size:7.5rem 100%;transition:width .5s}

/* ---------- stage ---------- */
main{flex:1;min-height:0;overflow:auto;
  padding-block:1.2rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.card{
  max-width:1280px;margin:0 auto;background:var(--paper);border-radius:22px;
  border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
  padding:clamp(1rem,2.2vw,2rem);
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1rem,2.4vw,2.2rem);
  animation:pop .35s ease-out;
}
.card.solo{grid-template-columns:minmax(0,1fr)}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}*{transition:none!important}}
.col{min-width:0;display:flex;flex-direction:column;gap:.9rem}
.eyebrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.78rem;letter-spacing:.08em;color:var(--ink-soft)}
.tag{background:var(--ink);color:#fff;border-radius:99px;padding:.1rem .7rem;font-weight:700}
.tag.red{background:var(--engine)}
.clock{font-family:var(--f-num);color:var(--engine);letter-spacing:.05em}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.75rem}
h1{font-size:2.6rem}
.body{font-size:1.05rem;margin:0;max-width:44em}
.body b{color:var(--engine-dk)}
.opts{display:grid;gap:.6rem}
.opt{
  display:grid;grid-template-columns:2.1rem 1fr;gap:.7rem;align-items:center;text-align:left;
  background:#fff;border:3px solid var(--line);border-radius:14px;padding:.65rem .85rem;font-size:1.02rem;
  transition:transform .12s, border-color .12s, background .12s;
}
.opt:hover:not([disabled]){border-color:var(--ink);transform:translateX(3px)}
.opt .k{width:2.1rem;height:2.1rem;border-radius:10px;display:grid;place-items:center;background:var(--sea);font-family:var(--f-num);font-size:.85rem}
.opt.sel{border-color:var(--ink);background:#fff6d6}
.opt.sel .k{background:var(--sun)}
.opt.ok{border-color:var(--good);background:#e5f6ee}
.opt.ok .k{background:var(--good);color:#fff}
.opt.bad{border-color:var(--warn);background:#fff0e2}
.opt.bad .k{background:var(--warn);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.btn{
  border:3px solid var(--ink);background:var(--engine);color:#fff;border-radius:14px;
  padding:.6rem 1.3rem;font-family:var(--f-display);font-size:1.15rem;box-shadow:4px 4px 0 var(--ink);
  transition:transform .1s, box-shadow .1s;
}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{background:#c9d2d8;color:#6b7c88;cursor:not-allowed;box-shadow:4px 4px 0 #9fb0bc;border-color:#9fb0bc}
.btn.alt{background:#fff;color:var(--ink)}
.hint{font-size:.8rem;color:var(--ink-soft)}

/* feedback */
.fb{border-radius:16px;padding:.9rem 1.1rem;border:3px solid;display:grid;gap:.4rem;animation:pop .3s ease-out}
.fb.g{border-color:var(--good);background:#e8f7f0}
.fb.m{border-color:var(--sun);background:#fff7dc}
.fb.b{border-color:var(--warn);background:#fff1e4}
.fb h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.fb h3 .pts{font-family:var(--f-num);font-size:.95rem;background:var(--ink);color:#fff;border-radius:99px;padding:.05rem .6rem}
.fb p{margin:0}
.point{border-left:6px solid var(--engine);background:#fff;padding:.45rem .8rem;border-radius:0 10px 10px 0;font-size:.95rem}
.point b{color:var(--engine-dk)}

/* side media */
.photo{margin:0;border-radius:16px;overflow:hidden;border:3px solid var(--ink);background:#000;position:relative}
.photo img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.photo figcaption{position:absolute;left:.6rem;top:.6rem;background:var(--sun);color:var(--ink);font-weight:700;border-radius:99px;padding:.1rem .8rem;font-size:.85rem;border:2px solid var(--ink)}
.panel{background:var(--sea);border-radius:16px;padding:1rem 1.1rem;border:2px dashed var(--ink-soft)}
.panel h4{margin:0 0 .5rem;font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.qlist li{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.5rem;align-items:center;background:#fff;border-radius:10px;padding:.4rem .6rem;font-size:.92rem}
.qlist li em{font-style:normal;font-family:var(--f-num);font-size:.75rem;color:var(--engine)}
.chip{font-size:.75rem;font-weight:700;border-radius:99px;padding:.05rem .55rem;white-space:nowrap}
.chip.y{background:#d7f2e4;color:#11704a}
.chip.n{background:#ffe0cf;color:#9c3d0c}
.chip.u{background:#fff0bf;color:#7a5a00}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.vs div{border-radius:14px;padding:.8rem 1rem;font-size:.95rem}
.vs .peace{background:#eaf3f8;border:2px solid #b8d2e1}
.vs .war{background:#ffece8;border:2px solid #f2b2a6}
.vs b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin-bottom:.2rem}

/* match / order / multi */
.slots{display:grid;gap:.55rem}
.slot{display:grid;grid-template-columns:10.5rem minmax(0,1fr);gap:.6rem;align-items:stretch}
.slot .lab{background:var(--ink);color:#fff;border-radius:12px;padding:.45rem .7rem;font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:.4rem}
.slot .lab .big{font-family:var(--f-num);font-size:1.3rem;color:var(--sun)}
.drop{min-height:2.9rem;border:3px dashed #a9bcc8;border-radius:12px;padding:.4rem .7rem;font-size:.92rem;display:flex;align-items:center;background:#fff;text-align:left;width:100%}
.drop.can{border-color:var(--engine);background:#fff3ef}
.drop.filled{border-style:solid;border-color:var(--ink)}
.drop.ok{border-color:var(--good);background:#e5f6ee}
.drop.bad{border-color:var(--warn);background:#fff0e2}
.drop .ans{display:block;font-size:.8rem;color:var(--good);font-weight:700;margin-top:.15rem}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.piece{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:.45rem .75rem;font-size:.92rem;text-align:left;box-shadow:3px 3px 0 var(--ink);max-width:100%}
.piece.sel{background:var(--sun);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.piece.used{opacity:.25;pointer-events:none;box-shadow:none}
.seq{display:flex;flex-wrap:wrap;gap:.5rem;min-height:3.2rem;padding:.5rem;border:3px dashed #a9bcc8;border-radius:14px;background:#fff;align-items:center}
.seq .piece{display:flex;gap:.5rem;align-items:center}
.seq .n{font-family:var(--f-num);font-size:.8rem;background:var(--ink);color:#fff;border-radius:8px;padding:.05rem .4rem}
.seq .piece.ok{border-color:var(--good);background:#e5f6ee}
.seq .piece.bad{border-color:var(--warn);background:#fff0e2}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.55rem}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.2rem}
.mapbox{border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#eef4ea}
.mapbox svg{display:block;width:100%;height:auto}
.spot{cursor:pointer}
.spot circle.hit{fill:#fff;stroke:var(--ink);stroke-width:3}
.spot:hover circle.hit{fill:var(--sun)}
.spot text{font-family:var(--f-num);font-size:20px;fill:var(--ink);pointer-events:none}
.spot .lbl{font-family:var(--f-body);font-size:15px;font-weight:700;fill:var(--ink)}
.roles{display:grid;gap:.5rem}
.role{display:grid;grid-template-columns:2.3rem 1fr;gap:.6rem;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:.5rem .7rem;font-size:.92rem}
.role .dot{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-num)}
.role.sel{border-color:var(--ink);background:#fff6d6}
.role small{display:block;color:var(--ink-soft);font-size:.78rem;line-height:1.4}
.role .at{font-weight:700;color:var(--engine-dk)}
.legend{display:grid;gap:.25rem;font-size:.82rem}
.legend span{display:flex;gap:.4rem;align-items:center}
.legend i{width:1rem;height:1rem;border-radius:4px;display:inline-block;flex:none}

/* intro / end */
.hero{display:grid;gap:1rem;align-content:start}
.hero .lead{font-size:1.15rem;max-width:40em;margin:0}
.kit{display:flex;flex-wrap:wrap;gap:.5rem}
.kit span{background:var(--sea);border:2px solid var(--ink);border-radius:99px;padding:.15rem .8rem;font-size:.9rem;font-weight:500}
.nodecard{display:grid;gap:.8rem;justify-items:start}
.bignum{font-family:var(--f-num);font-size:5.5rem;line-height:1;color:var(--engine);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink)}
.grade{font-family:var(--f-num);font-size:6rem;line-height:1;color:var(--sun);-webkit-text-stroke:4px var(--ink);text-shadow:7px 7px 0 var(--ink)}
.bars{display:grid;gap:.45rem}
.bar{display:grid;grid-template-columns:7.5rem 1fr 4.5rem;gap:.6rem;align-items:center;font-size:.9rem}
.bar .track{height:1rem;border-radius:99px;background:var(--sea);border:2px solid var(--ink);overflow:hidden}
.bar .track div{height:100%;background:var(--good)}
.bar .v{font-family:var(--f-num);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.6rem}
.recap div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem;font-size:.88rem}
.recap b{font-family:var(--f-display);font-weight:400;color:var(--engine-dk);display:block}
.disclaim{font-size:.75rem;color:var(--ink-soft)}

/* footer & teacher */
.foot{
  display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding-block:.5rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:rgba(255,253,247,.85);border-top:2px solid var(--ink);font-size:.8rem;
}
.foot .tb{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:.25rem .7rem;font-size:.85rem}
.foot .tb.on{background:var(--sun)}
.keys{color:var(--ink-soft)}
.keys kbd{font-family:var(--f-num);font-size:.7rem;border:2px solid var(--ink-soft);border-radius:6px;padding:0 .3rem;background:#fff}
.teacher[hidden]{display:none}
.teacher{max-width:1280px;margin:1rem auto 0;background:var(--ink);color:#fff;border-radius:16px;padding:1rem 1.2rem;display:grid;gap:.4rem}
.teacher h4{margin:0;font-family:var(--f-display);font-weight:400;color:var(--sun);font-size:1.1rem}
.teacher p{margin:0;font-size:.95rem}

@media (max-width:900px){
  .card,.mapwrap{grid-template-columns:minmax(0,1fr)}
  .top{grid-template-columns:1fr auto}
  .route{grid-column:1/-1;order:3}
  .buoy span{display:none}
  .risk{display:none}
  .vs{grid-template-columns:1fr}
  h2{font-size:1.45rem}
  .slot{grid-template-columns:minmax(0,1fr)}
}
</style>

<header class="top">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#e2412e" stroke="#fff" stroke-width="3"/><path d="M11 25h18v-6l-4-5h-6v4h-8z" fill="#fff"/><circle cx="15" cy="27" r="2.6" fill="#16324a"/><circle cx="26" cy="27" r="2.6" fill="#16324a"/></svg>
    <div><small>課程四｜M6 戰時出勤八節點</small><b>羅格鎮出勤任務</b></div>
  </div>
  <nav class="route" id="route" aria-label="八節點進度"></nav>
  <div class="stats">
    <div class="risk" title="錯誤決策會讓隊伍風險上升">
      <small><span>隊伍風險</span><span id="riskLbl">低</span></small>
      <div class="riskbar"><div id="riskBar"></div></div>
    </div>
    <div class="score"><small>任務分</small><b id="score">0</b></div>
  </div>
</header>

<main id="main">
  <section class="card" id="card"></section>
  <aside class="teacher" id="teacher" hidden></aside>
</main>

<footer class="foot">
  <div class="row">
    <button class="tb" id="tBtn" type="button">講師提示</button>
    <button class="tb" id="restart" type="button">重新開局</button>
    <span id="confirmRestart" hidden>確定重來？ <button class="tb" id="yesRestart" type="button">是，重新開局</button> <button class="tb" id="noRestart" type="button">取消</button></span>
  </div>
  <div class="keys">快捷鍵：<kbd>1</kbd>–<kbd>9</kbd> 選擇　<kbd>Enter</kbd> 確認／下一步　<kbd>T</kbd> 講師提示</div>

  <text x="700" y="44" text-anchor="middle" font-size="13" fill="#b52a1b">倒塌警戒區 ≈ 32 m</text>
  ${reveal?`<g font-size="15" font-weight="700"><text x="700" y="110" text-anchor="middle" fill="#9c2414">熱區</text><text x="470" y="140" fill="#7a5a00" paint-order="stroke" stroke="#fff" stroke-width="4">暖區</text><text x="40" y="600" fill="#2e63b8">冷區（超出範圍皆屬冷區）</text></g>`:""}`;
  for(const [k,p] of Object.entries(SPOTS)){
    const rid=Object.keys(place).find(r=>place[r]===k);
    const role=rid?ROLES[rid-1]:null;
    s+=`<g class="spot" data-spot="${k}" tabindex="0" role="button" aria-label="候選點 ${k} ${p.l}">
      <circle class="hit" cx="${p.x}" cy="${p.y}" r="22" ${role?`style="fill:${role.c};stroke:#16324a"`:""}/>
      <text x="${p.x}" y="${p.y+7}" text-anchor="middle" ${role?'style="fill:#fff"':''}>${role?role.id:k}</text>
      <text class="lbl" x="${p.x}" y="${p.y+44}" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">${k} ${p.l}</text>
    </g>`;
  }
  return s+`</svg>`;
}

let steps, st;
function fresh(){steps=buildSteps();st={i:0,score:0,max:0,risk:0,log:{},ans:false,sel:null,multi:new Set(),assign:{},pick:null,seq:[],place:{},role:1,teacher:st?st.teacher:false};render()}

function side(s){

  if(s.side==="relief") return `<div class="panel" style="background:#e8f7f0;border-color:var(--good)"><h4>為什麼他知道去哪裡？</h4><p style="margin:0">⑤ 初期部署時標記的 <b>備援撤離點</b>：遠離目標區，原路無法返回時的替代避難位置。<br>⑦ 撤離後的 <b>PAR 清點</b>：讓指揮官立刻知道少了誰。<br>⑧ <b>失聯位置紀錄</b>：最後已知位置與時間，是尋回人員的依據。</p></div>`;

}
function chip(v){return v==="y"?'<span class="chip y">是</span>':v==="n"?'<span class="chip n">否</span>':'<span class="chip u">不明</span>'}

const GOOD=["判斷正確！","漂亮的決策！","穩！就是這樣","全隊安全，任務推進！"];
function feedback(s,got,extra){
  const r=got/s.max, cls=r>=1?"g":r>0?"m":"b";
  const head=r>=1?GOOD[st.i%GOOD.length]:r>0?"方向對了，還可以更好":"風險上升，再想想";
  return `<div class="fb ${cls}" id="fb"><h3>${head}<span class="pts">+${got}</span></h3>${extra||""}${s.explain?`<p>${s.explain}</p>`:""}${s.point?`<div class="point"><b>重點　</b>${s.point}</div>`:""}</div>`;
}
function nextBtn(){return `<div class="row"><button class="btn" id="next" type="button">${st.i>=steps.length-2?"看任務結算 →":"下一步 →"}</button></div>`}

function grade(got){
  const s=steps[st.i];
  st.score+=got;st.max+=s.max;st.ans=true;
  st.log[s.n]=st.log[s.n]||{got:0,max:0};st.log[s.n].got+=got;st.log[s.n].max+=s.max;
  st.risk+=Math.round((1-got/s.max)*9);
  render();
  const fb=$("#fb");if(fb)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function render(){
  const s=steps[st.i];
  card.classList.remove("solo");void card.offsetWidth;
  card.style.animation="none";void card.offsetWidth;card.style.animation="";
  route(s.type==="intro"?null:s.type==="end"?8:s.n);hud();teacher();
  const R={intro,node,story,choice,multi,match,order,map:mapStep,end}[s.type];
  R(s);
  const nb=$("#next");if(nb)nb.onclick=next;
}
function next(){st.i++;st.ans=false;st.sel=null;st.multi=new Set();st.assign={};st.pick=null;st.seq=[];st.place={};st.role=1;
  const s=steps[st.i];
  if(s.type==="match")s.order=shuffle(s.items.map((_,i)=>i));
  if(s.type==="order")s.pool=shuffle(s.items.map((_,i)=>i));
  if(s.type==="multi")s.view=shuffle(s.items.map((_,i)=>i));
  if(s.type==="choice"&&!s.fixed&&!s._sh){s.opts=shuffle(s.opts);s._sh=true}
  render();$("#main").scrollTo({top:0,behavior:"smooth"})}

function node(s){

    <div class="bignum">${CIRC[s.n]}</div><h1>${NODES[s.n]}</h1>

function story(s){

function choice(s){
  const sd=side(s);if(!sd)card.classList.add("solo");
  const opts=s.opts.map((o,i)=>{
    let c="";const best=Math.max(...s.opts.map(x=>x.s));

  card.innerHTML=`<div class="col">${eyebrow(s)}<h2>${s.title}</h2>${s.body?`<p class="body">${s.body}</p>`:""}<div class="opts">${opts}</div>

function multi(s){
  card.classList.add("solo");
  const view=s.view||(s.view=shuffle(s.items.map((_,i)=>i)));
  const items=view.map((idx,k)=>{const it=s.items[idx];let c="";
    if(st.ans){c=it.c?"ok":st.multi.has(idx)?"bad":"dim"}else if(st.multi.has(idx))c="sel";
    const mark=st.ans&&it.c&&!st.multi.has(idx)?" （漏選）":"";
    return `<button class="opt ${c}" data-i="${idx}" ${st.ans?"disabled":""} type="button"><span class="k">${k+1}</span><span>${it.t}${mark}</span></button>`}).join("");
  const nc=s.items.filter(x=>x.c).length;
  let body=`<div class="col">${eyebrow(s)}<h2>${s.title}</h2><p class="body">${s.body}</p><div class="multi">${items}</div>`;
  if(st.ans){body+=feedback(s,s._got,"")+nextBtn()}
  else body+=`<div class="row"><button class="btn" id="go" type="button" ${st.multi.size?"":"disabled"}>確認決策</button><span class="hint">已選 ${st.multi.size} 項，可複選</span></div>`;
  card.innerHTML=body+"</div>";
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.multi.has(i)?st.multi.delete(i):st.multi.add(i);render()});
  const go=$("#go");if(go)go.onclick=()=>{let tp=0,fp=0;st.multi.forEach(i=>s.items[i].c?tp++:fp++);

function match(s){
  card.classList.add("solo");
  const order=s.order||(s.order=shuffle(s.items.map((_,i)=>i)));
  const used=new Set(Object.values(st.assign));
  const slots=s.slots.map((sl,k)=>{const a=st.assign[k];let c=a!==undefined?"filled":st.pick!==null?"can":"";
    if(st.ans)c=a===k?"ok":"bad";
    return `<div class="slot"><div class="lab"><span class="big">${sl.k}</span>${sl.l}</div><button class="drop ${c}" data-k="${k}" type="button" ${st.ans?"disabled":""}><span>${a!==undefined?s.items[a]:"點這裡放入"}${st.ans&&a!==k?`<span class="ans">正解：${s.items[k]}</span>`:""}</span></button></div>`}).join("");
  const pool=order.map((idx,n)=>`<button class="piece ${used.has(idx)?"used":""} ${st.pick===idx?"sel":""}" data-i="${idx}" type="button">${s.items[idx]}</button>`).join("");
  const full=Object.keys(st.assign).length===s.slots.length;
  let fb="";
  if(st.ans){fb=feedback(s,s._got,`<p>答對 ${s._right}／${s.slots.length} 項。</p>`)+nextBtn()}
  card.innerHTML=`<div class="col">${eyebrow(s)}<h2>${s.title}</h2><p class="body">${s.body}</p>
    <div class="slots">${slots}</div>${st.ans?"":`<div class="pool">${pool}</div>`}
    ${st.ans?fb:`<div class="row"><button class="btn" id="go" type="button" ${full?"":"disabled"}>確認決策</button><button class="btn alt" id="clr" type="button">清除重排</button></div>`}</div>`;
  card.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.pick=st.pick===i?null:i;
    // auto place to first empty slot? keep manual
    render()});
  card.querySelectorAll(".drop").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(st.pick!==null){for(const kk in st.assign)if(st.assign[kk]===st.pick)delete st.assign[kk];st.assign[k]=st.pick;st.pick=null}
    else if(st.assign[k]!==undefined){delete st.assign[k]}
    render()});
  const clr=$("#clr");if(clr)clr.onclick=()=>{st.assign={};st.pick=null;render()};
  const go=$("#go");if(go)go.onclick=()=>{let r=0;s.slots.forEach((_,k)=>{if(st.assign[k]===k)r++});s._right=r;s._got=Math.round(s.max*r/s.slots.length);grade(s._got)};
}
function order(s){
  card.classList.add("solo");
  const pool=s.pool||(s.pool=shuffle(s.items.map((_,i)=>i)));
  const seq=st.seq.map((idx,p)=>{let c=st.ans?(idx===p?"ok":"bad"):"";return `<button class="piece ${c}" data-p="${p}" type="button" ${st.ans?"disabled":""}><span class="n">${p+1}</span>${s.items[idx]}</button>`}).join("")||`<span class="hint">依序點下方卡片，排在這裡</span>`;
  const pl=pool.map(idx=>`<button class="piece ${st.seq.includes(idx)?"used":""}" data-i="${idx}" type="button">${s.items[idx]}</button>`).join("");
  let fb="";
  if(st.ans)fb=feedback(s,s._got,`<p>正確順序：${s.items.join(" → ")}</p>`)+nextBtn();
  card.innerHTML=`<div class="col">${eyebrow(s)}<h2>${s.title}</h2><p class="body">${s.body}</p>
    <div class="seq">${seq}</div>${st.ans?"":`<div class="pool">${pl}</div>`}
    ${st.ans?fb:`<div class="row"><button class="btn" id="go" type="button" ${st.seq.length===s.items.length?"":"disabled"}>確認決策</button><button class="btn alt" id="clr" type="button">清除重排</button></div>`}</div>`;
  card.querySelectorAll(".pool .piece").forEach(b=>b.onclick=()=>{st.seq.push(+b.dataset.i);render()});
  card.querySelectorAll(".seq .piece").forEach(b=>b.onclick=()=>{st.seq.splice(+b.dataset.p,1);render()});
  const clr=$("#clr");if(clr)clr.onclick=()=>{st.seq=[];render()};
  const go=$("#go");if(go)go.onclick=()=>{let r=0;st.seq.forEach((idx,p)=>{if(idx===p)r++});s._got=Math.round(s.max*r/s.items.length);grade(s._got)};
}
function mapStep(s){
  card.classList.add("solo");
  const roles=ROLES.map(r=>{const at=st.place[r.id];let res="";
    if(st.ans){const ok=at===r.ans;res=`<small style="color:${ok?"var(--good)":"var(--engine-dk)"};font-weight:700">${(ROLE_FB[r.id]&&ROLE_FB[r.id][at])||SPOTS[at].why}${ok?"":"　正解："+r.ans+" "+SPOTS[r.ans].l}</small>`}
    return `<button class="role ${st.role===r.id&&!st.ans?"sel":""}" data-r="${r.id}" type="button" ${st.ans?"disabled":""}><span class="dot" style="background:${r.c}">${r.id}</span><span><b>${r.l}</b>${at?` <span class="at">→ ${at} ${SPOTS[at].l}</span>`:""}<small>${r.d}</small>${res}</span></button>`}).join("");
  const full=Object.keys(st.place).length===4;
  let fb="";
  if(st.ans)fb=feedback(s,s._got,`<p>答對 ${s._right}／4 個位置。地圖已標出熱區（前進點以內）、暖區（前進點／待命點）、冷區（撤離點／後送線）。</p>`)+nextBtn();
  card.innerHTML=`<div class="col">${eyebrow(s)}<h2>${s.title}</h2><p class="body">${s.body}</p>
    <div class="mapwrap"><div class="mapbox" id="mapbox">${mapSVG(st.place,st.ans)}</div>
    <div class="col"><div class="roles">${roles}</div>
    ${st.ans?`<div class="legend"><span><i style="background:#ffb3a6"></i>熱區／威脅區：前進點以內</span><span><i style="background:#ffe7a8"></i>暖區／作業區：前進點、待命點</span><span><i style="background:#cfe9f7"></i>冷區／後勤照護區：撤離點、後送線</span></div>`:
    `<div class="row"><button class="btn" id="go" type="button" ${full?"":"disabled"}>確認部署</button><button class="btn alt" id="clr" type="button">清除</button></div>`}</div></div>
    ${fb}</div>`;
  card.querySelectorAll(".role").forEach(b=>b.onclick=()=>{st.role=+b.dataset.r;render()});
  if(!st.ans)card.querySelectorAll(".spot").forEach(g=>{const f=()=>{const k=g.dataset.spot;
    for(const r in st.place)if(st.place[r]===k)delete st.place[r];
    st.place[st.role]=k;
    const nxt=ROLES.find(r=>!st.place[r.id]);if(nxt)st.role=nxt.id;render()};
    g.onclick=f;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  const clr=$("#clr");if(clr)clr.onclick=()=>{st.place={};st.role=1;render()};
  const go=$("#go");if(go)go.onclick=()=>{let r=0;ROLES.forEach(x=>{if(st.place[x.id]===x.ans)r++});s._right=r;s._got=r*5;grade(s._got)};
}
function end(){
  card.classList.add("solo");
  const pct=st.max?st.score/st.max:0;
  const g=pct>=.9?["S","王牌帶隊官","每個節點都守住了底線，全隊平安回來。"]:pct>=.75?["A","可靠的帶隊官","大部分決策正確，回頭看看扣分的節點。"]:pct>=.6?["B","穩健的帶隊官","方向掌握了，部分細節還要練到變成習慣。"]:["C","見習帶隊官","戰時的直覺和平時不同，再跑一次會更熟。"];
  const bars=NODES.map((t,i)=>{const l=st.log[i]||{got:0,max:0};const p=l.max?l.got/l.max:0;
    return `<div class="bar"><span>${CIRC[i]} ${t}</span><div class="track"><div style="width:${p*100}%;background:${p>=.9?"var(--good)":p>=.6?"var(--sun)":"var(--warn)"}"></div></div><span class="v">${l.got}/${l.max}</span></div>`}).join("");
  const recap=[["① 受理研判","Go／No-Go 四問，任一否或不明就降級。降級不是放棄。"],["② 任務確認","五項核心：威脅與任務、編組／代理、路線與集結、通訊四層、撤離條件。"],["③ 出勤","先遣＋主力、拉開車距；雙路線；燈號分段管制。"],["④ 抵達現場","先遣偵察、分段投入；安全官專責兼對空觀測。"],["⑤ 初期部署","前進點、待命點、撤離集結點、備援撤離點。"],["⑥ 現場作業","GOTWA＋複誦；守勢救災；表淺搜救；先止血。"],["⑦ 撤離","條件先律定；PAR 清點；同仁受困三要件。"],["⑧ 返隊交接","交接六項、戰損紀錄三項、油料紅線、72 小時。"]].map(r=>`<div><b>${r[0]}</b>${r[1]}</div>`).join("");
  card.innerHTML=`<div class="col" style="gap:1.2rem">
    <div class="eyebrow"><span class="tag red">任務結算</span><span class="clock">D+3 18:50　全員返隊</span></div>
    <div class="row" style="gap:1.6rem;align-items:center"><div class="grade">${g[0]}</div><div><h1>${g[1]}</h1><p class="body">${g[2]}</p>
      <p class="body">任務分 <b style="font-family:var(--f-num);font-weight:400;font-size:1.4rem">${st.score}</b> ／ ${st.max}　隊伍風險：${st.risk<25?"低":st.risk<55?"中":"高"}</p></div></div>
    <div class="bars">${bars}</div>
    <h2 style="font-size:1.3rem">八節點重點卡</h2><div class="recap">${recap}</div>
    <div class="row"><button class="btn" id="again" type="button">再出勤一次（路況事件會換）</button></div></div>`;
  $("#again").onclick=fresh;
}

/* ---------- controls ---------- */
$("#tBtn").onclick=()=>{st.teacher=!st.teacher;teacher()};
$("#restart").onclick=()=>{$("#confirmRestart").hidden=false;$("#restart").hidden=true};
$("#noRestart").onclick=()=>{$("#confirmRestart").hidden=true;$("#restart").hidden=false};
$("#yesRestart").onclick=()=>{$("#confirmRestart").hidden=true;$("#restart").hidden=false;fresh()};
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  const s=steps[st.i];
  if(e.key==="t"||e.key==="T"){st.teacher=!st.teacher;teacher();return}
  if(e.key==="Enter"){
    if(document.activeElement&&document.activeElement.matches(".spot,.tb"))return;
    const b=$("#next")||$("#go");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9&&!st.ans){
    if(s.type==="choice"&&n<=s.opts.length){st.sel=n-1;render()}
    else if(s.type==="multi"&&n<=s.items.length){const i=s.view[n-1];st.multi.has(i)?st.multi.delete(i):st.multi.add(i);render()}
    else if(s.type==="map"&&n<=4){st.role=n;render()}
  }
});
fresh();
</script>
