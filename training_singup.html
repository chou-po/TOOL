<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金門縣消防人力動員教育訓練</title>
    <!-- 引入 Bootstrap CSS 讓介面更美觀 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 SheetJS 處理 Excel 上傳 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { padding-top: 20px; }
        .tab-content { padding-top: 20px; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4 no-print">金門縣消防人力動員教育訓練系統</h2>

    <!-- 頁籤導覽 (不列印) -->
    <ul class="nav nav-tabs no-print" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">報名與完訓</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="signin-tab" data-bs-toggle="tab" data-bs-target="#signin" type="button" role="tab">製作簽到表</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button" role="tab" onclick="renderStats()">統計</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="manage-tab" data-bs-toggle="tab" data-bs-target="#manage" type="button" role="tab">管理與設定</button>
        </li>
    </ul>

    <!-- 頁籤內容 -->
    <div class="tab-content" id="myTabContent">
        
        <!-- 1. 報名與完訓功能 -->
        <div class="tab-pane fade show active no-print" id="register" role="tabpanel">
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label">選擇身份</label>
                    <select class="form-select" id="roleSelect" onchange="updateUnitSelect()">
                        <option value="">請選擇</option>
                        <option value="消防">消防</option>
                        <option value="義消">義消</option>
                        <option value="睦鄰">睦鄰</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">選擇單位</label>
                    <select class="form-select" id="unitSelect" onchange="renderRegisterTable()">
                        <option value="">請先選擇身份</option>
                    </select>
                </div>
            </div>
            
            <div class="card mb-3">
                <div class="card-body bg-light">
                    <h5>批次報名設定</h5>
                    <div class="row align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">選擇訓練日期</label>
                            <select class="form-select" id="batchDateSelect"></select>
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary" onclick="applyBatchDate()">為勾選人員套用日期</button>
                        </div>
                    </div>
                </div>
            </div>

            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                        <th>單位</th>
                        <th>職稱</th>
                        <th>姓名</th>
                        <th>報名日期 (可獨立調整)</th>
                        <th>完訓</th>
                    </tr>
                </thead>
                <tbody id="registerTableBody">
                    <!-- 動態產生 -->
                </tbody>
            </table>
        </div>

        <!-- 2. 製作簽到表功能 -->
        <div class="tab-pane fade" id="signin" role="tabpanel">
            <div class="row mb-3 no-print">
                <div class="col-md-4">
                    <label class="form-label">選擇列印日期</label>
                    <select class="form-select" id="printDateSelect"></select>
                </div>
                <div class="col-md-4 align-self-end">
                    <button class="btn btn-success" onclick="renderSignInTable()">產生簽到表</button>
                    <button class="btn btn-secondary" onclick="window.print()">列印 / 匯出 PDF</button>
                </div>
            </div>
            
            <div id="printArea">
                <h3 class="text-center print-only">金門縣消防人力動員教育訓練 簽到表</h3>
                <h5 class="text-center print-only" id="printDateTitle"></h5>
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>單位</th>
                            <th>職稱</th>
                            <th>姓名</th>
                            <th>簽到</th>
                            <th>簽退</th>
                        </tr>
                    </thead>
                    <tbody id="signInTableBody">
                        <!-- 動態產生 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 統計功能 -->
        <div class="tab-pane fade no-print" id="stats" role="tabpanel">
            <table class="table table-striped table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>身份</th>
                        <th>單位</th>
                        <th>單位人數</th>
                        <th>單位完訓人數</th>
                        <th>完訓比例</th>
                    </tr>
                </thead>
                <tbody id="statsTableBody">
                    <!-- 動態產生 -->
                </tbody>
            </table>
        </div>

        <!-- 4. 管理功能 -->
        <div class="tab-pane fade no-print" id="manage" role="tabpanel">
            <div class="card mb-4">
                <div class="card-header">更新名冊資料 (Excel)</div>
                <div class="card-body">
                    <p class="text-muted">請上傳包含「身份、單位、職稱、姓名」四個欄位的 Excel 檔（如：義消清冊.xlsx）。<br>⚠️ 注意：上傳新名冊會與現有名冊合併，若有同單位同名同姓者將視為同一人，保留其報名紀錄。</p>
                    <input type="file" class="form-control mb-2" id="excelUpload" accept=".xlsx, .xls">
                    <button class="btn btn-danger" onclick="handleFileUpload()">上傳並更新名冊</button>
                    <button class="btn btn-outline-danger ms-3" onclick="clearAllData()">清空所有系統資料</button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">訓練日期管理</div>
                <div class="card-body">
                    <ul class="list-group mb-3" id="dateList">
                        <!-- 動態產生 -->
                    </ul>
                    <div class="input-group">
                        <input type="text" class="form-control" id="newDateInput" placeholder="輸入新日期 (例: 115/12/01)">
                        <button class="btn btn-primary" onclick="addDate()">新增日期</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 預設資料初始化
    const defaultDates = ['115/10/04', '115/10/31', '115/11/01', '115/11/13', '115/11/14'];
    let dates = JSON.parse(localStorage.getItem('trainingDates')) || defaultDates;
    
    // roster 結構: { id, role, unit, title, name, assignedDate: '', isCompleted: false }
    let roster = JSON.parse(localStorage.getItem('trainingRoster')) || [];

    // 初始化下拉選單
    function initSelects() {
        const dateSelects = [document.getElementById('batchDateSelect'), document.getElementById('printDateSelect')];
        dateSelects.forEach(select => {
            select.innerHTML = '<option value="">請選擇日期</option>';
            dates.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
        });
        renderDateList();
    }

    // 更新單位下拉選單
    function updateUnitSelect() {
        const role = document.getElementById('roleSelect').value;
        const unitSelect = document.getElementById('unitSelect');
        unitSelect.innerHTML = '<option value="">請選擇單位</option>';
        if (!role) return;
        
        const units = [...new Set(roster.filter(p => p.role === role).map(p => p.unit))];
        units.forEach(u => unitSelect.innerHTML += `<option value="${u}">${u}</option>`);
        renderRegisterTable();
    }

    // 渲染報名表格
    function renderRegisterTable() {
        const role = document.getElementById('roleSelect').value;
        const unit = document.getElementById('unitSelect').value;
        const tbody = document.getElementById('registerTableBody');
        tbody.innerHTML = '';

        if (!role || !unit) return;

        const filtered = roster.filter(p => p.role === role && p.unit === unit);
        
        let dateOptions = '<option value="">無</option>';
        dates.forEach(d => dateOptions += `<option value="${d}">${d}</option>`);

        filtered.forEach((person, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="person-checkbox" value="${person.id}"></td>
                <td>${person.unit}</td>
                <td>${person.title}</td>
                <td>${person.name}</td>
                <td>
                    <select class="form-select form-select-sm" onchange="updatePersonDate('${person.id}', this.value)">
                        ${dateOptions.replace(`value="${person.assignedDate}"`, `value="${person.assignedDate}" selected`)}
                    </select>
                </td>
                <td>
                    <input type="checkbox" class="form-check-input" ${person.isCompleted ? 'checked' : ''} onchange="updatePersonStatus('${person.id}', this.checked)">
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 產生唯一ID (以單位+姓名為主，避免重複匯入)
    function generateId(person) {
        return `${person.unit}_${person.name}`;
    }

    // 全選/取消全選
    function toggleSelectAll() {
        const isChecked = document.getElementById('selectAll').checked;
        document.querySelectorAll('.person-checkbox').forEach(cb => cb.checked = isChecked);
    }

    // 批次套用日期
    function applyBatchDate() {
        const selectedDate = document.getElementById('batchDateSelect').value;
        if (!selectedDate) return alert("請先選擇要批次套用的日期！");
        
        const checkboxes = document.querySelectorAll('.person-checkbox:checked');
        if(checkboxes.length === 0) return alert("請先勾選人員！");

        checkboxes.forEach(cb => {
            const pIndex = roster.findIndex(p => p.id === cb.value);
            if(pIndex > -1) roster[pIndex].assignedDate = selectedDate;
        });
        saveData();
        renderRegisterTable();
    }

    // 獨立更新日期與完訓狀態
    function updatePersonDate(id, date) {
        const pIndex = roster.findIndex(p => p.id === id);
        if(pIndex > -1) roster[pIndex].assignedDate = date;
        saveData();
    }
    function updatePersonStatus(id, isCompleted) {
        const pIndex = roster.findIndex(p => p.id === id);
        if(pIndex > -1) roster[pIndex].isCompleted = isCompleted;
        saveData();
    }

    // 儲存資料到 localStorage
    function saveData() {
        localStorage.setItem('trainingRoster', JSON.stringify(roster));
        localStorage.setItem('trainingDates', JSON.stringify(dates));
    }

    // 產生簽到表
    function renderSignInTable() {
        const targetDate = document.getElementById('printDateSelect').value;
        if(!targetDate) return alert("請選擇日期！");
        
        document.getElementById('printDateTitle').innerText = `訓練日期：${targetDate}`;
        const tbody = document.getElementById('signInTableBody');
        tbody.innerHTML = '';

        const participants = roster.filter(p => p.assignedDate === targetDate);
        participants.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.unit}</td><td>${p.title}</td><td>${p.name}</td>
                    <td style="width:15%"></td><td style="width:15%"></td>
                </tr>
            `;
        });
        
        // 增加5個空白列
        for(let i=0; i<5; i++){
            tbody.innerHTML += `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`;
        }
    }

    // 渲染統計資料
    function renderStats() {
        const tbody = document.getElementById('statsTableBody');
        tbody.innerHTML = '';

        const groups = {};
        roster.forEach(p => {
            const key = `${p.role}_${p.unit}`;
            if(!groups[key]) groups[key] = { role: p.role, unit: p.unit, total: 0, completed: 0 };
            groups[key].total += 1;
            if(p.isCompleted) groups[key].completed += 1;
        });

        for (const key in groups) {
            const g = groups[key];
            const ratio = g.total === 0 ? 0 : Math.round((g.completed / g.total) * 100);
            tbody.innerHTML += `
                <tr>
                    <td>${g.role}</td>
                    <td>${g.unit}</td>
                    <td>${g.total}</td>
                    <td>${g.completed}</td>
                    <td>${ratio}%</td>
                </tr>
            `;
        }
    }

    // Excel 上傳處理
    function handleFileUpload() {
        const fileInput = document.getElementById('excelUpload');
        const file = fileInput.files[0];
        if(!file) return alert("請先選擇檔案！");

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

            // 預期欄位: 身份, 單位, 職稱, 姓名
            let newCount = 0;
            for(let i=1; i<jsonData.length; i++) {
                const row = jsonData[i];
                if(row.length >= 4 && row[0] && row[1] && row[2] && row[3]) {
                    const person = { role: row[0], unit: row[1], title: row[2], name: row[3], assignedDate: '', isCompleted: false };
                    person.id = generateId(person);
                    
                    // 檢查是否已存在，若不存在則新增
                    if(!roster.find(p => p.id === person.id)) {
                        roster.push(person);
                        newCount++;
                    }
                }
            }
            saveData();
            alert(`名冊更新成功！共新增 ${newCount} 筆資料。`);
            fileInput.value = '';
            updateUnitSelect();
        };
        reader.readAsArrayBuffer(file);
    }

    // 訓練日期管理
    function renderDateList() {
        const list = document.getElementById('dateList');
        list.innerHTML = '';
        dates.forEach((d, idx) => {
            list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                ${d} 
                <button class="btn btn-sm btn-danger" onclick="removeDate(${idx})">刪除</button>
            </li>`;
        });
    }
    function addDate() {
        const newDate = document.getElementById('newDateInput').value.trim();
        if(newDate && !dates.includes(newDate)) {
            dates.push(newDate);
            document.getElementById('newDateInput').value = '';
            saveData();
            initSelects();
        }
    }
    function removeDate(idx) {
        if(confirm(`確定刪除日期 ${dates[idx]} 嗎？這不會刪除人員，但會影響選單。`)) {
            dates.splice(idx, 1);
            saveData();
            initSelects();
        }
    }
    function clearAllData() {
        if(confirm("警告！這將會清除所有人員名冊、報名紀錄與完訓資料，確定執行嗎？")) {
            roster = [];
            saveData();
            location.reload();
        }
    }

    // 啟動時初始化
    window.onload = initSelects;
</script>

</body>
</html>
