<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>金門縣消防人力動員教育訓練</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{padding:16px 0;font-family:"Microsoft JhengHei",sans-serif}
#busy{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:9999;text-align:center;padding-top:25vh}
.tb th,.tb td{border:1px solid #000!important;text-align:center;vertical-align:middle}
@media print{.no-print{display:none!important}}
</style></head><body>
<div id="busy"><div class="spinner-border text-primary"></div><h5 class="mt-3">處理中…</h5></div>
<div class="container">
<h3 class="text-center fw-bold mb-3 no-print">金門縣消防人力動員教育訓練報名系統</h3>
<ul class="nav nav-tabs no-print">
 <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pubTab">報名</button></li>
 <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admTab">管理員</button></li>
</ul>
<div class="tab-content pt-3">

<div class="tab-pane fade show active no-print" id="pubTab">
 <div class="row g-2 mb-3">
  <div class="col-md-4"><label class="form-label fw-bold">選擇單位</label><select id="unit" class="form-select border-dark" onchange="loadList()"></select></div>
 </div>
 <div id="pubArea" hidden>
  <div class="card bg-light mb-3"><div class="card-body row g-2 align-items-end">
   <div class="col-md-4"><label class="form-label">批次選梯次</label><select id="batchDate" class="form-select border-dark"></select></div>
   <div class="col-md-5"><button class="btn btn-outline-primary" onclick="applyBatch()">套用到勾選人員</button></div>
  </div></div>
  <div class="table-responsive"><table class="table tb table-hover">
   <thead class="table-dark"><tr><th><input type="checkbox" onchange="document.querySelectorAll('.ck').forEach(c=>c.checked=this.checked)"></th><th>職稱</th><th>姓名</th><th>報名梯次</th><th>素食</th><th>義消公假單位</th></tr></thead>
   <tbody id="tb"></tbody></table></div>
  <button class="btn btn-success fw-bold" onclick="savePub()">送出報名</button>
 </div>
</div>

<div class="tab-pane fade" id="admTab">
 <div class="row g-2 mb-3 no-print">
  <div class="col-md-3"><input id="pw" type="password" class="form-control border-dark" placeholder="管理密碼"></div>
  <div class="col-md-2"><button class="btn btn-dark" onclick="login()">登入 / 重新整理</button></div>
 </div>
 <div id="admArea" hidden>
  <div class="row g-2 mb-3 no-print">
   <div class="col-md-3"><select id="admDate" class="form-select border-dark" onchange="showDate()"></select></div>
   <div class="col-md-9"><button class="btn btn-info text-white" onclick="exportSign()">匯出簽到表 Word</button>
    <button class="btn btn-secondary" onclick="window.print()">列印簽到表</button>
    <button class="btn btn-info text-white" onclick="exportDone()">匯出完訓名單 Word</button>
    <button class="btn btn-warning" onclick="exportLeave()">匯出義消公假名單 Excel</button></div>
  </div>
  <div class="no-print"><div class="d-flex justify-content-between align-items-center mb-2"><h5 class="fw-bold mb-0">該梯次人員(勾選完訓)</h5>
   <button id="saveDoneBtn" class="btn btn-success fw-bold" onclick="saveDone()" disabled>儲存完訓勾選</button></div>
   <table class="table tb"><thead class="table-dark"><tr><th>單位</th><th>職稱</th><th>姓名</th><th>完訓<br><input type="checkbox" onchange="allDone(this.checked)" title="本梯次全選"></th></tr></thead><tbody id="doneTb"></tbody></table></div>
  <div id="printArea"><h4 class="text-center fw-bold">金門縣消防人力動員教育訓練 簽到表</h4><h5 class="text-center" id="pTitle"></h5>
   <table class="table tb"><thead><tr><th>編號</th><th>單位</th><th>職稱</th><th>姓名</th><th>簽到</th><th>簽退</th><th>備註</th></tr></thead><tbody id="signTb"></tbody></table></div>
  <div class="no-print"><h5 class="fw-bold mt-4">各梯次參訓人數</h5>
   <table class="table tb table-striped"><thead class="table-success" id="dateHead"></thead><tbody id="dateTb"></tbody></table>
   <h5 class="fw-bold mt-4">各單位統計</h5>
   <table class="table tb table-striped"><thead class="table-primary"><tr><th>身份</th><th>單位</th><th>人數</th><th>報名人數</th><th>完訓人數</th><th>完訓比例</th></tr></thead><tbody id="statTb"></tbody></table></div>
 </div>
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API='AKfycbzWBtyVkwvl9QHU3oYMVYjSoToeBI9zOHXVnvj76U_M8b0cPM9_LoXoxN_x7WYdLUz-';   // ← 部署 Apps Script 後取得
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let dates=[],list=[],adm=[],pw='';
const un=p=>{const s=new Set(adm.filter(x=>x.unit===p.unit).map(x=>x.role));return s.size>1?p.role+p.unit:p.unit;};

async function call(body){
  $('busy').style.display='block';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const j=await r.json(); if(j.error) throw new Error(j.error); return j;
  }catch(e){ alert('錯誤:'+e.message); return null; }
  finally{ $('busy').style.display='none'; }
}
const dateOpts=(ph,sel)=>`<option value="">${ph}</option>`+dates.map(d=>`<option ${d===sel?'selected':''}>${esc(d)}</option>`).join('');

(async()=>{
  const j=await call({action:'init'}); if(!j) return; dates=j.dates;
  const g={}; j.units.forEach(u=>(g[u.role]=g[u.role]||[]).push(u.unit));
  $('unit').innerHTML='<option value="">請選擇單位</option>'+Object.keys(g).map(r=>
    `<optgroup label="${esc(r)}">`+g[r].map(u=>`<option value="${esc(r+'|'+u)}">${esc(u)}</option>`).join('')+'</optgroup>').join('');
})();

/* ---------- 一般人:報名 ---------- */
async function loadList(){
  const unit=$('unit').value;
  if(!unit){ $('pubArea').hidden=true; return; }
  const [role,un]=unit.split('|');
  const j=await call({action:'list',role,unit:un}); if(!j) return;
  list=j.people; dates=j.dates; renderList();
}
function renderList(){
  $('batchDate').innerHTML=dateOpts('請選擇梯次');
  $('tb').innerHTML=list.map(p=>`<tr data-id="${esc(p.id)}"><td><input type="checkbox" class="ck"></td>
   <td>${esc(p.title)}</td><td>${esc(p.name)}</td>
   <td><select class="form-select form-select-sm border-dark">${dateOpts('未報名',p.date)}</select></td>
   <td><input type="checkbox" class="veg" ${p.veg?'checked':''}></td>
   <td><input class="form-control form-control-sm border-dark leave" maxlength="50" value="${esc(p.leave)}"></td></tr>`).join('');
  $('pubArea').hidden=false;
}
function applyBatch(){
  const d=$('batchDate').value; if(!d) return alert('請先選擇梯次');
  const rows=[...$('tb').rows].filter(r=>r.querySelector('.ck').checked);
  if(!rows.length) return alert('請先勾選人員');
  rows.forEach(r=>r.querySelector('select').value=d);
}
async function savePub(){
  const items=[]; [...$('tb').rows].forEach(tr=>{
    const o=list.find(p=>p.id===tr.dataset.id),
      n={id:o.id,date:tr.querySelector('select').value,veg:tr.querySelector('.veg').checked,leave:tr.querySelector('.leave').value.trim()};
    if(n.date!==o.date||n.veg!==o.veg||n.leave!==o.leave) items.push(n);
  });
  if(!items.length) return alert('沒有任何變更');
  const j=await call({action:'save',role:$('unit').value.split('|')[0],unit:$('unit').value.split('|')[1],items}); if(!j) return;
  alert(`已送出 ${items.length} 筆變更`); loadList();
}

/* ---------- 管理員 ---------- */
async function login(){
  if(Object.keys(dirty).length && !confirm('有尚未儲存的完訓勾選,重新整理會遺失,確定嗎?')) return;
  dirty={}; updBtn();
  pw=$('pw').value||pw;
  const j=await call({action:'adminList',pw}); if(!j) return;
  adm=j.people; dates=j.dates; const cur=$('admDate').value;
  $('admDate').innerHTML=dateOpts('請選擇梯次',cur); $('admArea').hidden=false; showDate(); stats();
}
const sel=()=>adm.filter(p=>p.date&&p.date===$('admDate').value);
function showDate(){
  const d=$('admDate').value, ps=sel(); $('pTitle').textContent=d?`訓練日期:${d}`:'';
  $('doneTb').innerHTML=ps.map(p=>`<tr><td>${esc(un(p))}</td><td>${esc(p.title)}</td><td>${esc(p.name)}</td>
    <td><input type="checkbox" ${p.done?'checked':''} onchange="markDone('${esc(p.id)}',this.checked)"></td></tr>`).join('')
    ||'<tr><td colspan="4">該梯次目前無人報名</td></tr>';
  $('signTb').innerHTML=signRows(ps);
}
function signRows(ps){
  const rem=p=>[p.veg?'素食':'',p.leave].filter(Boolean).join(' / ');
  let h=ps.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(un(p))}</td><td>${esc(p.title)}</td><td>${esc(p.name)}</td><td></td><td></td><td>${esc(rem(p))}</td></tr>`).join('');
  for(let i=0;i<5;i++) h+=`<tr style="height:42px"><td>${ps.length+i+1}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
  return h;
}
let dirty={};
function markDone(id,v){ adm.find(p=>p.id===id).done=v; dirty[id]=v; updBtn(); stats(); }
function allDone(v){ sel().forEach(p=>{p.done=v;dirty[p.id]=v;}); showDate(); updBtn(); stats(); }
function updBtn(){ const n=Object.keys(dirty).length; $('saveDoneBtn').disabled=!n;
  $('saveDoneBtn').textContent=n?`儲存完訓勾選(${n} 筆待儲存)`:'儲存完訓勾選'; }
async function saveDone(){
  const items=Object.entries(dirty).map(([id,done])=>({id,done}));
  const j=await call({action:'setDone',pw,items}); if(!j) return;
  dirty={}; updBtn(); alert(`已儲存 ${j.count} 筆`);
}
window.addEventListener('beforeunload',e=>{ if(Object.keys(dirty).length){e.preventDefault();e.returnValue='';} });
function dateStats(){
  const roles=[...new Set(adm.map(p=>p.role))];
  $('dateHead').innerHTML='<tr><th>梯次</th>'+roles.map(r=>`<th>${esc(r)}</th>`).join('')+'<th>合計</th><th>素食</th><th>完訓</th></tr>';
  const row=(label,ps)=>`<tr><td>${esc(label)}</td>`+roles.map(r=>`<td>${ps.filter(p=>p.role===r).length}</td>`).join('')+
    `<td class="fw-bold">${ps.length}</td><td>${ps.filter(p=>p.veg).length}</td><td>${ps.filter(p=>p.done).length}</td></tr>`;
  const reg=adm.filter(p=>p.date);
  $('dateTb').innerHTML=dates.map(d=>row(d,adm.filter(p=>p.date===d))).join('')
    +`<tr class="table-warning fw-bold">${row('已報名合計',reg).slice(4)}`
    +`<tr class="table-light">${row('尚未報名',adm.filter(p=>!p.date)).slice(4)}`;
}
function stats(){ dateStats();
  const g={}; adm.forEach(p=>{const k=p.role+'|'+p.unit; const x=g[k]=g[k]||{role:p.role,unit:p.unit,t:0,r:0,d:0};
    x.t++; if(p.date)x.r++; if(p.done)x.d++;});
  $('statTb').innerHTML=Object.values(g).map(x=>`<tr><td>${esc(x.role)}</td><td>${esc(x.unit)}</td><td>${x.t}</td><td>${x.r}</td><td>${x.d}</td><td>${Math.round(x.d/x.t*100)}%</td></tr>`).join('');
}

/* ---------- 匯出義消公假名單 ---------- */
function exportLeave(){
  const d=$('admDate').value;   // 有選梯次就只匯出該梯次,沒選則匯出全部梯次
  const ps=adm.filter(p=>p.role==='義消'&&p.date&&p.leave&&(!d||p.date===d))
    .sort((a,b)=>a.leave.localeCompare(b.leave,'zh-Hant')||a.date.localeCompare(b.date)||a.unit.localeCompare(b.unit,'zh-Hant'));
  if(!ps.length) return alert(d?'該梯次沒有填寫公假單位的義消':'目前沒有填寫公假單位的義消');
  const aoa=[['序號','公假單位','訓練梯次','大隊/單位','職稱','姓名','完訓']].concat(
    ps.map((p,i)=>[i+1,p.leave,p.date,p.unit,p.title,p.name,p.done?'是':'']));
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:6},{wch:24},{wch:12},{wch:14},{wch:10},{wch:10},{wch:6}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'義消公假名單');
  XLSX.writeFile(wb,`義消公假名單${d?'_'+d.replace(/\//g,''):'_全部'}.xlsx`);
}

/* ---------- Word 匯出 ---------- */
function word(body,name){
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>td,th{border:1px solid #000;padding:8px;text-align:center}table{border-collapse:collapse;width:100%}</style></head><body>${body}</body></html>`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff',html],{type:'application/msword'}));
  a.download=name; a.click();
}
function exportSign(){
  if(!$('admDate').value) return alert('請先選擇梯次');
  word($('printArea').innerHTML,`簽到表_${$('admDate').value.replace(/\//g,'')}.doc`);
}
function exportDone(){
  const ps=adm.filter(p=>p.done); if(!ps.length) return alert('目前尚無完訓人員');
  word(`<h3 style="text-align:center">金門縣消防人力動員教育訓練 完訓人員名單</h3><table><tr><th>單位</th><th>職稱</th><th>姓名</th><th>完訓日期</th></tr>`+
    ps.map(p=>`<tr><td>${esc(un(p))}</td><td>${esc(p.title)}</td><td>${esc(p.name)}</td><td>${esc(p.date||'未記錄')}</td></tr>`).join('')+'</table>','完訓人員名單.doc');
}
</script></body></html>
